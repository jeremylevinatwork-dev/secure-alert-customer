<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Alert - Team Member</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(160deg,#0d2138 0%,#1a365d 55%,#2d4a7a 100%);color:#1a202c;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 20px 36px;}
.card{background:white;border-radius:20px;box-shadow:0 12px 48px rgba(0,0,0,0.4);max-width:420px;width:100%;padding:36px 32px;text-align:center;}
.logos{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:16px;}
.logos img{max-height:36px;max-width:100px;object-fit:contain;}
.brandlogo{max-height:64px !important;max-width:270px !important;width:auto;}
h1{color:#1a365d;font-size:24.5px;margin-bottom:6px;}
.subtitle{color:#666;font-size:14.5px;margin-bottom:20px;}
.gold-bar{height:4px;background:linear-gradient(90deg,#d4af37,#f6e27a,#d4af37);border-radius:2px;margin:16px 0;}
label{display:block;text-align:left;font-size:14.5px;font-weight:600;color:#1a365d;margin-bottom:6px;margin-top:14px;}
select,input,textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:18px;}
select:focus,input:focus,textarea:focus{outline:none;border-color:#1a365d;}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#1a365d,#2d4a7a);color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:18px;}
.btn:active{transform:scale(0.98);}
.err{color:#c53030;font-size:14.5px;margin-top:8px;display:none;}
.tribute{margin-top:20px;font-size:14.5px;font-weight:bold;color:#000;font-family:Georgia,serif;letter-spacing:0.5px;}
.producer{margin-top:8px;font-size:12.5px;color:#666;}
#ticketForm{display:none;text-align:left;}
#ticketForm h2{color:#1a365d;font-size:22.5px;margin-bottom:12px;text-align:center;}
.ticket-list{margin-top:20px;text-align:left;}
.ticket-item{background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:8px;font-size:15.5px;}
.ticket-item strong{color:#1a365d;}
.logout{margin-top:16px;background:#666;}

#loginView{display:flex;flex-direction:column;align-items:center;width:100%;}
.hero{width:100%;max-width:560px;border-radius:22px;padding:5px;background:linear-gradient(135deg,#d4af37,#f6e27a,#b8912a,#d4af37);box-shadow:0 18px 50px rgba(0,0,0,0.55);}
.hero img{display:block;width:100%;border-radius:18px;}
#loginCard{margin-top:-46px;position:relative;z-index:2;}
@media (max-width:560px){#loginCard{margin-top:-26px;}}

@media (min-width:1000px){
  #loginView{flex-direction:row;justify-content:center;align-items:center;gap:36px;}
  #loginView .hero{max-width:540px;}
  #loginCard{margin-top:0;}
}
</style>
</head>
<body>
<div id="loginView">
<div class="hero"><img src="team-collage.jpg" alt="Loews Hotels — our hotels and our team"></div>
<div class="card" id="loginCard">
<div class="logos"><img class="brandlogo" src="loews-hotels-logo.jpg" alt="Loews Hotels"></div>
<div class="gold-bar"></div>
<h1>Secure Alert</h1>
<p class="subtitle">Team Member</p>
<label>Select Your Hotel</label>
<select id="hotelSelect">
<option value="">-- Select Hotel --</option>
<option value="PBH">Loews Portofino Bay Hotel</option>
<option value="HRH">Hard Rock Hotel</option>
<option value="RPR">Loews Royal Pacific Resort</option>
<option value="SFR">Loews Sapphire Falls Resort</option>
<option value="AVA">Universal Aventura Hotel</option>
<option value="CBBR">Universal Cabana Bay Beach Resort</option>
<option value="ESS">Universal's Endless Summer Resort - Surfside</option>
<option value="ESD">Universal's Endless Summer Resort - Dockside</option>
<option value="SNR">Universal Stella Nova Resort</option>
<option value="TLR">Universal Terra Luna Resort</option>
<option value="HGH">Universal Helios Grand Hotel</option>
</select>
<label>Select Your Role</label>
<select id="roleSelect">
<option value="">-- Select Role --</option>
<option value="Manager">Manager</option>
<option value="Team Member">Team Member</option>
</select>
<label>Enter PIN</label>
<input type="password" id="pinInput" inputmode="numeric" maxlength="10" placeholder="••••">
<p class="err" id="pinErr"></p>
<button class="btn" onclick="doLogin()">Login</button>
<p class="tribute">Power by: NDL systems tech</p>
<p class="producer">Produced by: JHNL Security Tech</p>
</div>
</div>

<div class="card" id="ticketForm">
<h2>🎫 <span id="formTitle">Create Fob Ticket</span></h2>
<p class="subtitle" id="welcomeMsg">Welcome</p>
<div class="gold-bar"></div>
<div id="createSection">
<label>Fob ID</label>
<input type="text" id="fobId" placeholder="e.g. FOB-12345">
<label>Issue Type (check all that apply)</label>
<div style="text-align:left;background:#f7fafc;border:2px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:4px;">
<label style="display:flex;align-items:center;margin:8px 0;font-weight:normal;cursor:pointer;"><input type="checkbox" id="chkBroken" style="width:auto;margin-right:10px;transform:scale(1.3);"> Broken</label>
<label style="display:flex;align-items:center;margin:8px 0;font-weight:normal;cursor:pointer;"><input type="checkbox" id="chkCharging" style="width:auto;margin-right:10px;transform:scale(1.3);"> Not charging</label>
<label style="display:flex;align-items:center;margin:8px 0;font-weight:normal;cursor:pointer;"><input type="checkbox" id="chkTag" style="width:auto;margin-right:10px;transform:scale(1.3);"> Needs a new tag</label>
<label style="display:flex;align-items:center;margin:8px 0;font-weight:normal;cursor:pointer;"><input type="checkbox" id="chkIdPaper" style="width:auto;margin-right:10px;transform:scale(1.3);"> New ID tag paper</label>
</div>
<label>Additional Notes (optional)</label>
<textarea id="issueDesc" rows="2" placeholder="Any other details..."></textarea>
<button class="btn" onclick="submitTicket()">Submit Ticket</button>
</div>
<div class="ticket-list" id="ticketList"></div>
<div id="supportChat" style="text-align:left;">
<h3 style="color:#1a365d;margin:16px 0 4px;">💬 Chat with Support</h3>
<p class="subtitle" style="margin:0 0 8px;">Message the Security support team directly — they reply right here.</p>
<div id="chatMsgs" style="background:#f7fafc;border:2px solid #e2e8f0;border-radius:10px;padding:10px;height:220px;overflow-y:auto;"></div>
<div style="display:flex;gap:8px;margin-top:8px;">
<input type="text" id="chatIn" placeholder="Type a message to support..." style="flex:1;" onkeydown="if(event.key==='Enter'){sendSupportChat();}">
<button class="btn" style="width:auto;padding:12px 20px;margin:0;" onclick="sendSupportChat()">Send</button>
</div>
</div>
<button class="btn logout" onclick="doLogout()">Logout</button>
</div>

<script>
// Supabase config (same as Secure Alert app)
const SB_URL = 'https://qxqrwusaynfqadjfqswe.supabase.co';
const SB_KEY = 'sb_publishable_2ba9yzEA89uqXHJ6v-_cQg_AmwwEfFF';
const SB_TICKETS_ROW = 'customer-fob-tickets';

// Save approved ticket to Supabase so Secure Alert app can see it
async function saveTicketToSupabase(ticket) {
  try {
    // Get existing tickets
    const getRes = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + SB_TICKETS_ROW + '&select=data', {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
    });
    const rows = await getRes.json();
    let tickets = [];
    if (rows && rows.length > 0 && rows[0].data && rows[0].data.tickets) {
      tickets = rows[0].data.tickets;
    }
    tickets.push(ticket);
    const payload = {id: SB_TICKETS_ROW, app: 'customer-fob', data: {tickets: tickets}, updated_at: new Date().toISOString()};
    // Upsert
    const postRes = await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify(payload)
    });
    if (!postRes.ok) {
      const errText = await postRes.text();
      console.error('Supabase POST failed:', postRes.status, errText);
      return false;
    }
    return true;
  } catch (e) {
    console.error('Supabase save failed:', e);
    return false;
  }
}

// ----- Support chat: SEPARATE client-chat row (not the internal team chat).
// Hotels only see their own hotel's thread; the support team reads/replies from Team Chat's Client Chat view.
const SB_CHAT_ROW = 'client-chat';
let chatPoll = null;
let allClientMsgs = [];
function chatAuthor() {
  const sel = document.getElementById('hotelSelect');
  const hotelName = (sel && sel.selectedOptions && sel.selectedOptions[0]) ? sel.selectedOptions[0].text : currentHotel;
  return hotelName + ' (' + currentRole + ')';
}
function escChat(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function loadSupportChat() {
  try {
    const res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + SB_CHAT_ROW + '&select=data', {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
    });
    const rows = await res.json();
    allClientMsgs = (rows && rows[0] && rows[0].data && rows[0].data.messages) || [];
    // 30-day retention: drop older messages and save the pruned list back
    const cut = Date.now() - 30 * 24 * 3600 * 1000;
    const pruned = allClientMsgs.filter(m => !m.ts || new Date(m.ts).getTime() >= cut);
    if (pruned.length !== allClientMsgs.length) {
      allClientMsgs = pruned;
      fetch(SB_URL + '/rest/v1/app_records', {
        method: 'POST',
        headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'},
        body: JSON.stringify({id: SB_CHAT_ROW, app: 'client-chat', data: {messages: allClientMsgs}, updated_at: new Date().toISOString()})
      }).catch(() => {});
    }
    renderSupportChat();
    return allClientMsgs;
  } catch (e) { return allClientMsgs; }
}
function renderSupportChat() {
  const box = document.getElementById('chatMsgs'); if (!box) return;
  const me = chatAuthor();
  const last = allClientMsgs.filter(m => m.hotel === currentHotel).slice(-30);
  box.innerHTML = last.length ? last.map(m => {
    const mine = m.fromSupport !== true && m.name === me;
    const when = m.ts ? new Date(m.ts).toLocaleString([], {month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
    return '<div style="margin:0 0 8px;text-align:' + (mine ? 'right' : 'left') + '"><div style="display:inline-block;max-width:85%;background:' + (mine ? '#1a365d' : '#ffffff') + ';color:' + (mine ? '#ffffff' : '#1a202c') + ';border:1px solid #e2e8f0;border-radius:12px;padding:7px 10px;text-align:left;"><div style="font-size:12.5px;font-weight:700;color:' + (mine ? '#d4af37' : '#2d4a7a') + ';">' + (m.fromSupport ? 'Support' : escChat(m.name || '')) + '</div><div style="font-size:15.5px;">' + escChat(m.text || '') + (m.file ? ' &#128206;' : '') + '</div><div style="font-size:11px;opacity:.65;">' + when + '</div></div></div>';
  }).join('') : '<div style="color:#718096;font-size:14.5px;">No messages yet. Say hello to the support team.</div>';
  box.scrollTop = box.scrollHeight;
}
async function sendSupportChat() {
  const inp = document.getElementById('chatIn');
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  await loadSupportChat(); // refresh first so no messages get overwritten
  allClientMsgs.push({ name: chatAuthor(), text: text, ts: new Date().toISOString(), hotel: currentHotel, fromSupport: false });
  const payload = {id: SB_CHAT_ROW, app: 'client-chat', data: {messages: allClientMsgs.slice(-100000)}, updated_at: new Date().toISOString()};
  try {
    await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify(payload)
    });
  } catch (e) { console.error('Chat send failed:', e); }
  loadSupportChat();
}
function startChatPoll() { if (chatPoll) clearInterval(chatPoll); loadSupportChat(); chatPoll = setInterval(loadSupportChat, 15000); }

// Sample PINs - in production, these would be securely managed
const PINS = {
  "PBH-Manager": "1111", "PBH-Team Member": "2222",
  "HRH-Manager": "1111", "HRH-Team Member": "2222",
  "RPR-Manager": "1111", "RPR-Team Member": "2222",
  "SFR-Manager": "1111", "SFR-Team Member": "2222",
  "AVA-Manager": "1111", "AVA-Team Member": "2222",
  "CBBR-Manager": "1111", "CBBR-Team Member": "2222",
  "ESS-Manager": "1111", "ESS-Team Member": "2222",
  "ESD-Manager": "1111", "ESD-Team Member": "2222",
  "SNR-Manager": "1111", "SNR-Team Member": "2222",
  "TLR-Manager": "1111", "TLR-Team Member": "2222",
  "HGH-Manager": "1111", "HGH-Team Member": "2222",
};

let tickets = [];
let currentRole = '';
let currentHotel = '';
let ticketSearch = '';

function doLogin() {
  const hotel = document.getElementById('hotelSelect').value;
  const role = document.getElementById('roleSelect').value;
  const pin = document.getElementById('pinInput').value;
  const err = document.getElementById('pinErr');
  
  if (!hotel) { err.textContent = 'Please select your hotel'; err.style.display = 'block'; return; }
  if (!role) { err.textContent = 'Please select your role'; err.style.display = 'block'; return; }
  if (!pin) { err.textContent = 'Please enter your PIN'; err.style.display = 'block'; return; }
  
  const key = hotel + '-' + role;
  if (pin === (PINS[key] || '')) {
    currentRole = role;
    currentHotel = hotel;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('ticketForm').style.display = 'block';
    const hotelName = document.getElementById('hotelSelect').selectedOptions[0].text;
    document.getElementById('welcomeMsg').textContent = hotelName + ' - ' + role;
    // Team Members see creation form, Managers see approval list
    document.getElementById('createSection').style.display = (role === 'Team Member') ? 'block' : 'none';
    document.getElementById('formTitle').textContent = (role === 'Manager') ? 'Review Fob Tickets' : 'Create Fob Ticket';
    err.style.display = 'none';
    renderTickets();
    startChatPoll();
  } else {
    err.textContent = 'Incorrect PIN (demo: 1111 for Manager, 2222 for Team Member)';
    err.style.display = 'block';
  }
}

function submitTicket() {
  const fobId = document.getElementById('fobId').value.trim();
  const issues = [];
  if (document.getElementById('chkBroken').checked) issues.push('Broken');
  if (document.getElementById('chkCharging').checked) issues.push('Not charging');
  if (document.getElementById('chkTag').checked) issues.push('Needs a new tag');
  if (document.getElementById('chkIdPaper').checked) issues.push('New ID tag paper');
  const notes = document.getElementById('issueDesc').value.trim();
  if (!fobId) { alert('Please enter the Fob ID'); return; }
  if (issues.length === 0 && !notes) { alert('Please check an issue or add notes'); return; }
  
  const ticket = {
    id: 'TKT-' + Date.now().toString().slice(-6),
    fobId: fobId,
    issue: issues.join(', ') + (notes ? ' - ' + notes : ''),
    date: new Date().toLocaleString(),
    hotel: document.getElementById('hotelSelect').selectedOptions[0].text,
    hotelCode: document.getElementById('hotelSelect').value,
    role: document.getElementById('roleSelect').value,
    status: 'Pending Approval',
    approvedDate: '',
    approvedBy: ''
  };
  tickets.unshift(ticket);
  renderTickets();
  document.getElementById('fobId').value = '';
  document.getElementById('issueDesc').value = '';
  document.getElementById('chkBroken').checked = false;
  document.getElementById('chkCharging').checked = false;
  document.getElementById('chkTag').checked = false;
  document.getElementById('chkIdPaper').checked = false;
  alert('Ticket ' + ticket.id + ' submitted!');
}

function renderTickets() {
  const list = document.getElementById('ticketList');
  // Filter by current hotel
  let hotelTickets = tickets.filter(t => !currentHotel || t.hotelCode === currentHotel);
  // Manager search filter
  if (currentRole === 'Manager' && typeof ticketSearch !== 'undefined' && ticketSearch) {
    const q = ticketSearch.toLowerCase();
    hotelTickets = hotelTickets.filter(t => 
      (t.id||'').toLowerCase().includes(q) ||
      (t.fobId||'').toLowerCase().includes(q) ||
      (t.issue||'').toLowerCase().includes(q) ||
      (t.date||'').toLowerCase().includes(q) ||
      (t.approvedBy||'').toLowerCase().includes(q) ||
      (t.managerNotes||'').toLowerCase().includes(q)
    );
  }
  const title = currentRole === 'Manager' ? 'Tickets for Approval' : 'My Tickets';
  let searchHtml = '';
  if (currentRole === 'Manager') {
    searchHtml = '<input type="text" id="ticketSearchInput" placeholder="🔍 Search tickets (ID, Fob, issue...)" value="' + (typeof ticketSearch !== 'undefined' ? ticketSearch : '') + '" oninput="ticketSearch=this.value;renderTickets();" style="width:100%;padding:10px;margin:8px 0;border:2px solid #d4af37;border-radius:8px;font-size:15.5px;">';
  }
  if (hotelTickets.length === 0) {
    list.innerHTML = searchHtml + '<p style="color:#666;font-size:14.5px;text-align:center;margin-top:16px;">No tickets found</p>';
    return;
  }
  list.innerHTML = searchHtml + '<h3 style="color:#1a365d;font-size:18px;margin:16px 0 8px;">' + title + '</h3>' +
    hotelTickets.map((t) => {
      const idx = tickets.indexOf(t);
      let html = `<div class="ticket-item"><strong>${t.id}</strong> - ${t.fobId}<br><span style="color:#666;">${t.issue}</span><br><span style="color:#999;font-size:13.5px;">${t.date} | ${t.hotel}</span><br>`;
      if (t.managerNotes) {
        html += `<div style="background:#fff8e1;border:1px solid #d4af37;border-radius:6px;padding:6px 8px;margin:6px 0;font-size:14.5px;">📝 <strong>Manager notes:</strong> ${t.managerNotes}</div>`;
      }
      if (t.status === 'Pending Approval') {
        html += `<span style="color:#d69e2e;font-weight:bold;font-size:14.5px;">⏳ ${t.status}</span>`;
        if (currentRole === 'Manager') {
          html += `<br><button onclick="approveTicket(${idx})" style="margin-top:8px;padding:8px 16px;background:#0a7d2c;color:white;border:none;border-radius:6px;font-size:14.5px;font-weight:bold;cursor:pointer;">✓ Approve & Send to Support</button>`;
          html += `<button onclick="toggleEditTicket(${idx})" style="margin-top:8px;margin-left:6px;padding:8px 16px;background:#2d4a7a;color:white;border:none;border-radius:6px;font-size:14.5px;font-weight:bold;cursor:pointer;">✏️ Edit / Notes</button>`;
          html += `<div id="edit-${idx}" style="display:none;margin-top:10px;background:#f7f3e3;border:1px solid #d4af37;border-radius:8px;padding:10px;">
            <label style="font-size:13.5px;font-weight:bold;color:#1a365d;">Fob ID</label>
            <input type="text" id="edit-fob-${idx}" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ccc;border-radius:6px;font-size:15.5px;">
            <label style="font-size:13.5px;font-weight:bold;color:#1a365d;">Issue</label>
            <input type="text" id="edit-issue-${idx}" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ccc;border-radius:6px;font-size:15.5px;">
            <label style="font-size:13.5px;font-weight:bold;color:#1a365d;">Manager notes</label>
            <textarea id="edit-notes-${idx}" rows="2" placeholder="Add notes for the support team..." style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ccc;border-radius:6px;font-size:15.5px;"></textarea>
            <button onclick="saveTicketEdit(${idx})" style="padding:8px 16px;background:#1a365d;color:white;border:none;border-radius:6px;font-size:14.5px;font-weight:bold;cursor:pointer;">💾 Save Changes</button>
          </div>`;
        }
      } else {
        html += `<span style="color:#0a7d2c;font-weight:bold;font-size:14.5px;">✓ ${t.status}</span><br><span style="color:#999;font-size:13.5px;">Approved: ${t.approvedDate} by ${t.approvedBy}</span>`;
        if (currentRole === 'Manager') {
          html += `<br><button onclick="printTicket(${idx})" style="margin-top:8px;margin-right:6px;padding:6px 12px;background:#1a365d;color:white;border:none;border-radius:6px;font-size:13.5px;cursor:pointer;">🖨️ Print</button>`;
          html += `<button onclick="saveTicket(${idx})" style="margin-top:8px;padding:6px 12px;background:#2d4a7a;color:white;border:none;border-radius:6px;font-size:13.5px;cursor:pointer;">💾 Save</button>`;
        }
      }
      html += `</div>`;
      return html;
    }).join('');
}

// Manager: open/close the edit + notes panel on a pending ticket
function toggleEditTicket(idx) {
  const panel = document.getElementById('edit-' + idx);
  if (!panel) return;
  if (panel.style.display === 'none') {
    const t = tickets[idx];
    document.getElementById('edit-fob-' + idx).value = t.fobId || '';
    document.getElementById('edit-issue-' + idx).value = t.issue || '';
    document.getElementById('edit-notes-' + idx).value = t.managerNotes || '';
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
}

// Manager: save edits + notes on a pending ticket
function saveTicketEdit(idx) {
  const t = tickets[idx];
  if (!t) return;
  const fob = document.getElementById('edit-fob-' + idx).value.trim();
  const issue = document.getElementById('edit-issue-' + idx).value.trim();
  if (!fob) { alert('Fob ID cannot be empty'); return; }
  if (!issue) { alert('Issue cannot be empty'); return; }
  t.fobId = fob;
  t.issue = issue;
  t.managerNotes = document.getElementById('edit-notes-' + idx).value.trim();
  renderTickets();
  alert('Ticket ' + t.id + ' updated');
}

async function approveTicket(idx) {
  const sig = prompt('Type your signature (Manager name):');
  if (!sig || !sig.trim()) { alert('Signature is required'); return; }
  const t = tickets[idx];
  t.status = 'Approved - Sent to Support';
  t.approvedDate = new Date().toLocaleString();
  t.approvedBy = sig.trim();
  renderTickets();
  // Save to Supabase so Secure Alert app sees it
  const saved = await saveTicketToSupabase(t);
  // Automatically save a copy to Manager's computer (Secure Alert folder)
  saveTicket(idx);
  if (saved) {
    alert('Ticket ' + t.id + ' approved, saved to your computer, and sent to support team!');
  } else {
    alert('Ticket ' + t.id + ' approved and saved to your computer, but failed to sync to support. Check connection.');
  }
}

// Print a ticket (Manager)
function printTicket(idx) {
  const t = tickets[idx];
  if (!t) return;

// Save a ticket as HTML file (Manager)
function saveTicket(idx) {
  const t = tickets[idx];
  if (!t) return;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fob Ticket ${t.id}</title>
<style>body{font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:20px;color:#222;}
h1{color:#1a365d;border-bottom:3px solid #d4af37;padding-bottom:10px;}
.row{margin:12px 0;} .label{font-weight:bold;color:#1a365d;} .sig{margin-top:30px;border-top:1px solid #999;padding-top:8px;}</style></head><body>
<h1>🔐 Secure Alert — Fob Ticket</h1>
<div class="row"><span class="label">Ticket ID:</span> ${t.id}</div>
<div class="row"><span class="label">Hotel:</span> ${t.hotel}</div>
<div class="row"><span class="label">Fob ID:</span> ${t.fobId}</div>

${t.managerNotes ? `<div class="row"><span class="label">Manager Notes:</span> ${t.managerNotes}</div>` : ''}
<div class="row"><span class="label">Submitted:</span> ${t.date}</div>
<div class="row"><span class="label">Status:</span> ${t.status}</div>
<div class="row"><span class="label">Approved:</span> ${t.approvedDate || ''}</div>
<div class="sig"><span class="label">Manager Signature:</span> ${t.approvedBy || ''}</div>
<div class="sig"><span class="label">Date:</span> ${t.approvedDate || ''}</div>
</body></html>`;
  const blob = new Blob([html], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SecureAlert-' + t.id + '-' + (t.hotelCode || 'hotel') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function doLogout() {
  if (chatPoll) { clearInterval(chatPoll); chatPoll = null; }
  document.getElementById('ticketForm').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('pinInput').value = '';
  document.getElementById('hotelSelect').value = '';
  document.getElementById('roleSelect').value = '';
  currentRole = '';
  currentHotel = '';
  ticketSearch = '';
  renderTickets();
}

document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
renderTickets();
